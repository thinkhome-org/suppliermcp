[project]
name = "suppliermcp"
version = "2.0.2"
description = "Read-only supplier catalog MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp",
    "pydantic>=2,<3",
    "httpx",
    "zeep",
    "defusedxml",
    "psycopg[binary,pool]>=3.2,<4",
    "procrastinate",
    "pyjwt[crypto]",
    "fastapi>=0.162.0",
    "xlrd>=2.0.2,<3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "suppliermcp/skills"
"migrations" = "suppliermcp/migrations"
