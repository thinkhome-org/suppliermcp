[project]
name = "suppliermcp"
version = "0.1.0"
description = "Read-only supplier catalog MCP"
requires-python = ">=3.12,<3.13"
dependencies = ["fastmcp", "pydantic>=2,<3", "httpx", "zeep", "defusedxml", "psycopg[binary,pool]>=3,<4", "procrastinate", "pyjwt[crypto]"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
