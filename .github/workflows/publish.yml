name: publish-release-candidate
on:
  push:
    tags: ['v2.0.0-rc.*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/thinkhome-org/suppliermcp
      MCP_URL: https://suppliermcp.thinkhome.org/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.9'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Build version-matched release assets
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^2\.0\.0-rc\.[1-9][0-9]*$ ]]
          native="suppliermcp-codex-$version"
          portable="suppliermcp-portable-$version"
          uv build --wheel
          test -f "dist/suppliermcp-${version/-rc./rc}-py3-none-any.whl"
          cp -R integrations/codex/marketplace "$native"
          python integrations/codex/build_plugin.py "$native/plugins/suppliermcp" --codex --url "$MCP_URL"
          python integrations/codex/build_plugin.py "$portable" --url "$MCP_URL"
          jq -e --arg v "$version" '.version == $v' "$native/plugins/suppliermcp/.codex-plugin/plugin.json"
          jq -e --arg v "$version" '.version == $v' "$portable/plugin.json"
          zip -qr "dist/$native.zip" "$native"
          zip -qr "dist/$portable.zip" "$portable"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/thinkhome-org/suppliermcp
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke-test the published digest and record it
        env:
          SUPPLIERMCP_SMOKE_IMAGE: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
        run: |
          docker pull "$SUPPLIERMCP_SMOKE_IMAGE"
          uv run python scripts/portainer_smoke.py
          printf '%s\n' "$SUPPLIERMCP_SMOKE_IMAGE" | tee dist/image-reference.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Promote the verified manifest to candidate tags
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.whl *.zip image-reference.txt > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "SupplierMCP $GITHUB_REF_NAME" --notes "Candidate build of $GITHUB_SHA. Immutable GHCR image: $(cat image-reference.txt)." *
