name: publish-image
on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/thinkhome-org/suppliermcp
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          tags: ghcr.io/thinkhome-org/suppliermcp:sha-${{ github.event.workflow_run.head_sha }}
      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/thinkhome-org/suppliermcp@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
