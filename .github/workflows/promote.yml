name: promote-stable
on:
  push:
    tags: ['v2.0.0']
permissions:
  contents: read
concurrency: stable-2.0.0
jobs:
  promote:
    environment: supdb-stable
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RECORD: docs/releases/2.0.0
      IMAGE: ghcr.io/thinkhome-org/suppliermcp
    steps:
      - name: Require a protected stable-release environment
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/supdb-stable" |
            jq -e '(.can_admins_bypass == false) and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.9'
          python-version: '3.12'
      - name: Verify staged assets, source revision and scoped live acceptance
        run: |
          stage=$(jq -er .stage_tag "$RECORD/acceptance.json")
          [[ "$stage" =~ ^v2\.0\.0-stage\.[1-9][0-9]*$ ]]
          source=$(git rev-parse "refs/tags/$stage^{commit}")
          git merge-base --is-ancestor "$source" HEAD
          git diff --quiet "$source" HEAD -- . ":(exclude)$RECORD/operations.json" ":(exclude)$RECORD/acceptance.json" \
            ":(exclude)$RECORD/release-notes.md" ":(exclude)scripts/verify_promotion.py" \
            ":(exclude)docs/stable-release.md" ":(exclude)tests/test_promotion.py" ":(exclude).github/workflows/promote.yml"
          gh release view "$stage" --json isPrerelease,isDraft | jq -e '.isPrerelease and (.isDraft | not)'
          gh release download "$stage" --dir dist
          uv run --locked python scripts/verify_promotion.py "$RECORD" dist "$source"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the accepted manifest without rebuilding
        run: |
          image=$(cat dist/image-reference.txt)
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$(jq -r .source_commit "$RECORD/acceptance.json")"
          test "$(docker run --rm "$image" python -c 'from importlib.metadata import version; print(version("suppliermcp"))')" = 2.0.0
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "$image"
          test "$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)" = "${image#*@}"
      - name: Release the exact staged wheel and plugins
        run: |
          cd dist
          assets=(SHA256SUMS image-reference.txt suppliermcp-2.0.0-py3-none-any.whl suppliermcp-{codex,portable}-2.0.0.zip)
          notes="$GITHUB_WORKSPACE/docs/releases/2.0.0/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft | jq -e .isDraft
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
              --title 'SupDB 2.0.0' --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title 'SupDB 2.0.0' --notes-file "$notes" "${assets[@]}"
          fi
