name: validate
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.9'
          python-version: '3.12'
      - run: uv sync --locked
      - run: docker compose -f compose.test.yaml up -d --wait
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build --wheel
      - name: Verify installed wheel outside the checkout
        run: |
          uv pip install --reinstall --no-deps dist/*.whl
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_wheel.py")
      - run: docker build -t suppliermcp:local .
      - run: uv run python scripts/smoke.py
      - run: uv run python scripts/portainer_smoke.py
        env:
          SUPPLIERMCP_SMOKE_IMAGE: suppliermcp:local
      - if: always()
        run: docker compose -f compose.test.yaml down -v
