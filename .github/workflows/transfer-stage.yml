name: Transfer encrypted stage image
on:
  push:
    branches: [codex/stage-image-transfer]
permissions:
  contents: read
  packages: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Export exact image encrypted for VM
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/thinkhome-org/suppliermcp@sha256:023f84848fe6e8c4faa3442ed00ff0354eb36a868c5370068b014195df67a99b
          docker tag ghcr.io/thinkhome-org/suppliermcp@sha256:023f84848fe6e8c4faa3442ed00ff0354eb36a868c5370068b014195df67a99b supdb-stage-verified:2.0.0-stage.2
          cat > /tmp/transfer.crt <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEFTCCAn2gAwIBAgIUFAaR2TtFw5Mz5a6W/1Ggljhk04EwDQYJKoZIhvcNAQEL
