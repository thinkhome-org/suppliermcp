name: Transfer encrypted stage image
on:
  push:
    branches: [codex/stage-image-transfer]
permissions:
  contents: read
  packages: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Export exact image encrypted for VM
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/thinkhome-org/suppliermcp@sha256:c045b205c03c4ccae34f399bf7b583a6fbc6b12f86eaca72b57df124b55c73a0
          docker tag ghcr.io/thinkhome-org/suppliermcp@sha256:c045b205c03c4ccae34f399bf7b583a6fbc6b12f86eaca72b57df124b55c73a0 supdb-stage-verified:2.0.0-stage.1
          cat > /tmp/transfer.crt <<'CERT'
          -----BEGIN CERTIFICATE-----
